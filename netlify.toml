[build]
  publish = "."
  [build.environment]
    NODE_VERSION = "20"

# Redirecciones específicas (NO catch-all para no romper CV/PDF/imágenes)
[[redirects]]
  from = "/cv"
  to = "/cv_christian.html"
  status = 200

[[redirects]]
  from = "/cv-en"
  to = "/cv_christian.html?lang=en"
  status = 200

# Headers de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache de imágenes
[[headers]]
  for = "/imagen/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache de CSS/JS
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"